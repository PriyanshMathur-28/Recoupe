<!doctype html>
<html lang="en" class="h-full bg-background antialiased">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Revenue Recovery - Razorpay Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <!--
        landing.css and global.css are served by Flask directly from
        frontend/src/styles (see the routes in dashboard.py) rather than being
        bundled, so edits to them appear after a plain browser refresh with no
        npm build. They are linked before the bundle's compiled Tailwind sheet
        to preserve the previous cascade order (global.css then tailwind.css).
    -->
    <link rel="stylesheet" href="/landing.css" />
    <link rel="stylesheet" href="/global.css" />
</head>

<body class="flex h-full overflow-hidden bg-background">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
